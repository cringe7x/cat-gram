<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cato-gram Messenger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="flex-1 flex flex-col items-center justify-center bg-blue-600 text-white p-4">
        <div class="bg-white text-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h1 class="text-2xl font-bold mb-2">Welcome to Cato-gram</h1>
            <p class="text-gray-500 text-sm mb-6">Login with Google to start chatting</p>
            <button onclick="loginWithGoogle()" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-3 transition">
                <i class="fab fa-google text-lg"></i>
                <span>Continue with Google</span>
            </button>
        </div>
    </div>

    <!-- 2. PROFILE SETUP SCREEN -->
    <div id="profile-setup-screen" class="hidden flex-1 flex flex-col items-center justify-center bg-gray-50 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Complete Your Profile</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Choose Username (e.g., tutul123)</label>
                    <div class="flex items-center bg-gray-100 rounded-xl px-3 border border-gray-300">
                        <span class="text-gray-400 font-bold">@</span>
                        <input type="text" id="setup-username" placeholder="username" class="w-full bg-transparent py-2 px-1 focus:outline-none text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Profile Photo URL</label>
                    <input type="text" id="setup-photo" placeholder="Paste image link (URL)" class="w-full bg-gray-100 border border-gray-300 rounded-xl py-2 px-3 focus:outline-none text-sm">
                </div>
                <button onclick="saveProfile()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Save & Continue</button>
            </div>
        </div>
    </div>

    <!-- 3. MAIN CHAT SCREEN -->
    <div id="main-screen" class="hidden flex-1 flex flex-col h-screen">
        <!-- Top Navigation / Search Bar -->
        <header class="bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3 w-1/3">
                <img id="my-avatar" src="" class="w-10 h-10 rounded-full object-cover border">
                <div>
                    <h3 id="my-name" class="font-bold text-sm text-gray-800"></h3>
                    <p id="my-username" class="text-xs text-gray-500"></p>
                </div>
            </div>
            
            <!-- @Username Search Bar -->
            <div class="relative w-1/3">
                <input type="text" id="search-input" onkeyup="searchUser(event)" placeholder="Search @username..." class="w-full bg-gray-100 border border-gray-300 rounded-full py-2 px-4 text-sm focus:outline-none focus:border-blue-500">
                <!-- Search Result Dropdown -->
                <div id="search-result" class="absolute left-0 right-0 mt-2 bg-white border border-gray-200 rounded-xl shadow-lg hidden z-50"></div>
            </div>

            <div>
                <button onclick="logout()" class="text-red-500 text-sm font-semibold hover:underline">Logout</button>
            </div>
        </header>

        <!-- Chat Area -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Left Sidebar -->
            <div class="w-1/3 border-r border-gray-200 bg-white overflow-y-auto p-4 hidden md:block">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Instructions</h4>
                <p class="text-xs text-gray-600 leading-relaxed">
                    Uporer search box-e tomar bondhur unique <b>@username</b> likhe search koro. Search result-e ashar por click kore direct chat shuru koro!
                </p>
            </div>

            <!-- Right Main Chat Window -->
            <div class="flex-1 flex flex-col bg-gray-50">
                <!-- Chat Header with Call & Video Options -->
                <div id="chat-header" class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center">
                    <p class="text-gray-400 text-sm">Search a @username to start chatting.</p>
                </div>
                
                <!-- Message Box -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

                <!-- Input Footer with Emoji Button -->
                <div id="chat-input-area" class="hidden bg-white border-t border-gray-200 px-4 py-3 flex items-center space-x-2">
                    <!-- Emoji Button -->
                    <button onclick="addEmoji('😊')" class="text-gray-500 hover:text-blue-600 text-xl px-1">😊</button>
                    <button onclick="addEmoji('❤️')" class="text-gray-500 hover:text-red-500 text-xl px-1">❤️</button>
                    <button onclick="addEmoji('👍')" class="text-gray-500 hover:text-blue-500 text-xl px-1">👍</button>

                    <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 bg-gray-100 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
                    
                    <button onclick="sendChatMessage()" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-blue-700 transition shadow-md">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE & APP LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCJHAiS8Ux2CXfJt0bFHyCyDKRYpGVZuVg",
            authDomain: "cato-gram.firebaseapp.com",
            projectId: "cato-gram",
            storageBucket: "cato-gram.firebasestorage.app",
            messagingSenderId: "278062572176",
            appId: "1:278062572176:web:94447bf20860835398ee15",
            measurementId: "G-CZCRWG11FD"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentChatUser = null;
        let unsubscribeMessages = null;

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().username) {
                    showMainScreen(userDoc.data());
                } else {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('profile-setup-screen').classList.remove('hidden');
                    document.getElementById('setup-photo').value = user.photoURL || '';
                }
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('profile-setup-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.add('hidden');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => alert(error.message));
        }

        async function saveProfile() {
            let username = document.getElementById('setup-username').value.trim().toLowerCase();
            let photoURL = document.getElementById('setup-photo').value.trim();

            if (!username) {
                alert('Please enter a valid username');
                return;
            }

            const checkQuery = await db.collection('users').where('username', '==', username).get();
            if (!checkQuery.empty) {
                alert('This username is already taken! Try another.');
                return;
            }

            const userData = {
                uid: currentUser.uid,
                name: currentUser.displayName,
                email: currentUser.email,
                username: username,
                photoURL: photoURL || 'https://via.placeholder.com/150'
            };

            await db.collection('users').doc(currentUser.uid).set(userData);
            showMainScreen(userData);
        }

        function showMainScreen(userData) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('profile-setup-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');

            document.getElementById('my-avatar').src = userData.photoURL;
            document.getElementById('my-name').innerText = userData.name;
            document.getElementById('my-username').innerText = `@${userData.username}`;
        }

        function logout() {
            auth.signOut();
        }

        async function searchUser(e) {
            let query = e.target.value.trim().toLowerCase();
            const resultBox = document.getElementById('search-result');

            if (!query) {
                resultBox.classList.add('hidden');
                return;
            }

            if (query.startsWith('@')) query = query.substring(1);

            const snapshot = await db.collection('users')
                .where('username', '>=', query)
                .where('username', '<=', query + '\uf8ff')
                .get();

            resultBox.innerHTML = '';
            if (snapshot.empty) {
                resultBox.innerHTML = '<div class="p-3 text-xs text-gray-400">No user found</div>';
            } else {
                snapshot.forEach(doc => {
                    const user = doc.data();
                    if (user.uid !== currentUser.uid) {
                        resultBox.innerHTML += `
                            <div onclick="openChat('${user.uid}', '${user.name}', '${user.username}', '${user.photoURL}')" 
                                 class="flex items-center space-x-3 p-3 hover:bg-gray-100 cursor-pointer border-b last:border-none">
                                <img src="${user.photoURL}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <p class="text-xs font-bold text-gray-800">${user.name}</p>
                                    <p class="text-[10px] text-gray-500">@${user.username}</p>
                                </div>
                            </div>
                        `;
                    }
                });
            }
            resultBox.classList.remove('hidden');
        }

        function openChat(uid, name, username, photoURL) {
            currentChatUser = { uid, name, username, photoURL };
            document.getElementById('search-result').classList.add('hidden');
            document.getElementById('search-input').value = '';

            // Chat Header with User Info & Call/Video Buttons
            document.getElementById('chat-header').innerHTML = `
                <div class="flex items-center space-x-3">
                    <img src="${photoURL}" class="w-10 h-10 rounded-full object-cover border">
                    <div>
                        <h3 class="font-bold text-sm text-gray-800">${name}</h3>
                        <p class="text-xs text-gray-500">@${username}</p>
                    </div>
                </div>
                <div class="flex space-x-3 text-blue-600">
                    <button onclick="alert('Audio calling feature coming soon!')" class="w-9 h-9 bg-blue-50 hover:bg-blue-100 rounded-full flex items-center justify-center transition">
                        <i class="fas fa-phone-alt text-sm"></i>
                    </button>
                    <button onclick="alert('Video calling feature coming soon!')" class="w-9 h-9 bg-blue-50 hover:bg-blue-100 rounded-full flex items-center justify-center transition">
                        <i class="fas fa-video text-sm"></i>
                    </button>
                </div>
            `;
            document.getElementById('chat-input-area').classList.remove('hidden');

            loadMessages(uid);
        }

        function addEmoji(emoji) {
            const input = document.getElementById('msg-input');
            input.value += emoji;
            input.focus();
        }

        function loadMessages(recipientUid) {
            const container = document.getElementById('messages-container');
            
            const chatId = currentUser.uid < recipientUid 
                ? `${currentUser.uid}_${recipientUid}` 
                : `${recipientUid}_${currentUser.uid}`;

            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = db.collection('chats').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    container.innerHTML = '';
                    snapshot.expanded = true;
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMe = msg.sender === currentUser.uid;
                        container.innerHTML += `
                            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                <div class="max-w-[70%] px-4 py-2 rounded-2xl text-sm shadow-sm ${
                                    isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'
                                }">${msg.text}</div>
                            </div>
                        `;
                    });
                    container.scrollTop = container.scrollHeight;
                });
        }

        async function sendChatMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatUser) return;

            const chatId = currentUser.uid < currentChatUser.uid 
                ? `${currentUser.uid}_${currentChatUser.uid}` 
                : `${currentChatUser.uid}_${currentChatUser.uid}`;

            await db.collection('chats').doc(chatId).collection('messages').add({
                sender: currentUser.uid,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            input.value = '';
        }
    </script>
</body>
</html>
